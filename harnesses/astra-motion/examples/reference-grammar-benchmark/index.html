<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Astra reference grammar benchmark</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;font-family:Arial,sans-serif}
    #master{position:relative;width:1920px;height:1080px;overflow:hidden}.scene{position:absolute;inset:0;overflow:hidden}
    #posture{background:#fccc4d}.wall{position:absolute;top:0;bottom:0;width:340px;background:#e96282}.wall.a{left:0}.wall.b{right:0;background:#1ebaa7}.floor{position:absolute;left:0;right:0;bottom:0;height:140px;background:#003b5d}
    .label{position:absolute;left:80px;top:64px;color:#003b5d;font-weight:900;font-size:30px;letter-spacing:0}.headline{position:absolute;left:80px;top:105px;color:#fccc4d;font-weight:900;font-size:72px;letter-spacing:0;margin:0}
    #actor{position:absolute;left:650px;bottom:118px;width:520px;height:790px;overflow:visible}.skin{fill:#ff6585}.ink{fill:#003b5d}.shirt{fill:#785eae}.shoe{fill:#f7ead0}.limb{fill:none;stroke:#ff6585;stroke-width:46;stroke-linecap:round}.spine{fill:none;stroke:#f7ead0;stroke-width:17;stroke-linecap:round;stroke-dasharray:1 30}
    #xray{position:absolute;right:110px;top:155px;width:430px;height:720px;background:#003b5d;border:18px solid #785eae}#xray svg{width:100%;height:100%}.xray-bone{fill:none;stroke:#f7ead0;stroke-width:16;stroke-linecap:round}.xray-spine{fill:none;stroke:#e96282;stroke-width:14;stroke-dasharray:1 25;stroke-linecap:round}
    .metric{position:absolute;left:90px;bottom:95px;color:#f7ead0;font-size:31px;font-weight:800}.metric strong{display:block;color:#fccc4d;font-size:78px;line-height:1}
    #blood{visibility:hidden;background:#f7ead0;color:#440101;clip-path:circle(0% at 50% 50%)}#body-map{position:absolute;left:660px;top:80px;width:600px;height:900px}.circuit{fill:none;stroke:#d9232e;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.return{stroke:#24a58f;stroke-width:15}.heart{fill:#24a58f}.body-outline{fill:#f7ead0;stroke:#7e0103;stroke-width:18}
    #vessel{position:absolute;inset:0;opacity:0;background:#7e0103}.vessel-wall{position:absolute;left:0;right:0;height:235px;background:#440101;border-color:#ff6b55;border-style:solid}.vessel-wall.top{top:0;border-width:0 0 34px}.vessel-wall.bottom{bottom:0;border-width:34px 0 0}.cell-row{position:absolute;left:0;right:0;height:42px;background:repeating-linear-gradient(90deg,#d9232e 0 38px,#ff6b55 38px 52px)}.top .cell-row{bottom:12px}.bottom .cell-row{top:12px}
    .particle{position:absolute;width:38px;height:38px;border-radius:50%;background:#f7ead0;top:520px}.particle.alt{background:#ff6b55;width:52px;height:34px;border-radius:50%}.flow-arrow{position:absolute;top:500px;color:#fccc4d;font-size:72px;font-weight:900}.pressure-label{position:absolute;left:80px;top:64px;font-size:28px;color:#ff6b55;font-weight:900}.pressure-title{position:absolute;left:80px;top:103px;font-size:70px;margin:0;color:#f7ead0}.plaque{position:absolute;left:760px;bottom:235px;width:470px;height:210px;background:#fccc4d;clip-path:polygon(0 100%,10% 78%,21% 60%,33% 44%,47% 34%,61% 38%,75% 53%,88% 72%,100% 100%);transform-origin:50% 100%}
    #catheter{position:absolute;left:0;top:522px;width:1020px;height:14px;background:#f7ead0;transform-origin:left;opacity:0}#balloon{position:absolute;left:865px;top:420px;width:260px;height:210px;border:18px solid #f7ead0;border-radius:50%;opacity:0}.result{position:absolute;right:84px;bottom:70px;font-size:34px;font-weight:900;color:#f7ead0;opacity:0}
  </style>
</head>
<body>
<div id="master" data-composition-id="reference-grammar-benchmark" data-width="1920" data-height="1080" data-start="0" data-duration="24" data-fps="30">
  <section id="posture" class="scene">
    <div class="wall a"></div><div class="wall b"></div><div class="floor"></div>
    <div class="label">VISIBLE ACTION → HIDDEN MECHANISM</div><h1 class="headline">ALIGNMENT</h1>
    <svg id="actor" viewBox="0 0 520 790">
      <g id="torso"><path class="shirt" d="M155 310 Q260 250 365 310 L402 595 Q260 640 118 595Z"/><path id="arm" class="limb" d="M170 350 Q80 420 112 535"/><circle class="skin" cx="112" cy="540" r="31"/><path class="limb" d="M350 350 Q420 430 387 540"/><rect class="ink" x="356" y="512" width="82" height="126"/><path id="spine" class="spine" d="M260 315 C260 390 260 475 260 570"/></g>
      <g id="head"><circle class="skin" cx="260" cy="205" r="115"/><path class="ink" d="M150 190 Q165 70 285 72 Q390 82 375 205 Q330 130 150 190Z"/><g id="eyes"><ellipse class="ink" cx="230" cy="210" rx="18" ry="26"/><ellipse class="ink" cx="310" cy="210" rx="18" ry="26"/></g><path id="mouth" class="skin" stroke="#003b5d" stroke-width="13" fill="none" d="M235 270 Q270 292 312 267"/></g>
      <path class="limb" d="M185 590 Q165 690 150 748"/><path class="limb" d="M330 590 Q360 690 375 748"/><rect class="shoe" x="92" y="738" width="102" height="34"/><rect class="shoe" x="350" y="738" width="106" height="34"/>
    </svg>
    <div id="xray"><svg viewBox="0 0 430 720"><circle class="xray-bone" cx="215" cy="110" r="65"/><path class="xray-bone" d="M215 180 L215 570 M120 265 L310 265 M150 570 L110 685 M280 570 L325 685"/><path id="xray-spine" class="xray-spine" d="M215 190 C215 300 215 430 215 560"/></svg></div>
    <div class="metric"><strong>1 LINE</strong>organizes the whole pose</div>
  </section>
  <section id="blood" class="scene">
    <svg id="body-map" viewBox="0 0 600 900"><path class="body-outline" d="M230 100 Q300 45 370 100 L395 245 L490 340 L450 815 L350 815 L320 510 L280 510 L250 815 L150 815 L110 340 L205 245Z"/><path class="circuit" d="M300 220 L300 700 M300 300 L175 365 L175 650 M300 300 L425 365 L425 650 M230 165 L370 165"/><path class="circuit return" d="M270 220 L270 680 M270 330 L205 410 M330 330 L395 410"/><path class="heart" d="M300 335 C230 270 195 380 300 465 C405 380 370 270 300 335Z"/></svg>
    <div id="vessel"><div class="vessel-wall top"><div class="cell-row"></div></div><div class="vessel-wall bottom"><div class="cell-row"></div></div><div class="pressure-label">MECHANISM → CONSEQUENCE → INTERVENTION</div><h2 class="pressure-title">PRESSURE / FLOW</h2><div class="plaque"></div><div id="catheter"></div><div id="balloon"></div><div class="result">GEOMETRY CHANGES THE OUTCOME</div></div>
  </section>
</div>
<script>
  const tl=gsap.timeline({paused:true,defaults:{ease:'power2.inOut'}});
  gsap.set('#actor',{x:-900});gsap.set('#xray',{x:620});gsap.set('.plaque',{scaleY:0});gsap.set('#balloon',{scale:.15});gsap.set('#catheter',{scaleX:0});
  tl.to('#actor',{x:0,duration:1.1,ease:'back.out(1.15)'},0.2)
    .from('.headline',{y:30,opacity:0,duration:.6},.4)
    .to('#torso',{rotation:12,transformOrigin:'50% 90%',duration:1.2},1.8)
    .to('#head',{x:45,y:26,rotation:8,transformOrigin:'50% 70%',duration:1.1},1.95)
    .to('#eyes',{x:12,y:7,duration:.35,ease:'power2.out'},2.05)
    .to('#mouth',{attr:{d:'M235 278 Q270 267 312 278'},duration:.35},2.35)
    .to('#spine',{attr:{d:'M260 315 C300 385 300 495 260 570'},duration:1.2},1.8)
    .to('#arm',{attr:{d:'M170 350 Q50 435 112 535'},duration:.8},2.1)
    .to('#posture',{backgroundColor:'#2db985',duration:.15,ease:'none'},5.0)
    .to('#xray',{x:-620,duration:1,ease:'power3.out'},5.1)
    .to('#xray-spine',{attr:{d:'M215 190 C270 295 270 455 215 560'},duration:1},5.7)
    .to('#torso',{rotation:0,duration:1.15},7.5).to('#head',{x:0,y:0,rotation:0,duration:1.05},7.6)
    .to('#spine',{attr:{d:'M260 315 C260 390 260 475 260 570'},duration:1.1},7.5)
    .to('#eyes',{x:0,y:0,duration:.4},7.7).to('#mouth',{attr:{d:'M235 270 Q270 292 312 267'},duration:.45},7.9)
    .to('#xray-spine',{attr:{d:'M215 190 C215 300 215 430 215 560'},duration:1.1},7.5)
    .to('#xray',{x:620,duration:.18,ease:'none'},8.75)
    .to('#posture',{backgroundColor:'#fccc4d',duration:.18,ease:'none'},8.75)
    .to('#actor',{x:270,scale:1.04,duration:.45,ease:'power2.out'},8.9)
    .from('.metric',{x:-60,opacity:0,duration:.7},9.0)
    .set('#blood',{visibility:'visible'},11.3)
    .to('#blood',{clipPath:'circle(150% at 50% 50%)',duration:1.2,ease:'power3.inOut'},11.3)
    .to('#body-map',{scale:3.8,x:-370,y:-850,duration:1.7,ease:'power2.inOut'},12.4)
    .to('#body-map',{opacity:0,duration:.25},13.8).to('#vessel',{opacity:1,duration:.25},13.8);
  const particleColors=['#f7ead0','#ff6b55','#24a58f'];
  for(let i=0;i<14;i++){const p=document.createElement('div');p.className='particle'+(i%3===1?' alt':'');p.style.left=(-120-i*130)+'px';p.style.top=(440+(i%4)*58)+'px';p.style.background=particleColors[i%3];document.querySelector('#vessel').appendChild(p);tl.to(p,{x:2350,duration:5.2,ease:'none'},14.0+i*.08)}
  for(let i=0;i<5;i++){const a=document.createElement('div');a.className='flow-arrow';a.textContent='→';a.style.left=(220+i*320)+'px';document.querySelector('#vessel').appendChild(a);tl.fromTo(a,{opacity:.15,x:-25},{opacity:1,x:50,duration:.65,yoyo:true,repeat:3,ease:'sine.inOut'},14.2+i*.08)}
  tl.to('.vessel-wall.top',{height:300,duration:.7,yoyo:true,repeat:1,ease:'sine.inOut'},14.3)
    .to('.vessel-wall.bottom',{height:300,duration:.7,yoyo:true,repeat:1,ease:'sine.inOut'},14.3)
    .to('.plaque',{scaleY:1,duration:1.3,ease:'power2.out'},17.5)
    .to('#catheter',{opacity:1,scaleX:1,duration:.8,ease:'power2.out'},19.4)
    .to('#balloon',{opacity:1,scale:1,duration:.8,ease:'back.out(1.2)'},20.0)
    .to('.plaque',{scaleY:.45,duration:.9},20.5)
    .to('#balloon',{scale:1.5,duration:.9},20.8)
    .to('.result',{opacity:1,y:-15,duration:.6},22.0)
    .to({}, {duration:1.4});
  window.__timelines=window.__timelines||{};window.__timelines['reference-grammar-benchmark']=tl;
</script>
</body></html>
