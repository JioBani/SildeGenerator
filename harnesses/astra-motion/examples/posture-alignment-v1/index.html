<svg viewBox="0 0 640 360"><defs><clipPath id="screen"><rect width="640" height="360"/></clipPath></defs><g clip-path="url(#screen)">

<g id="sideDots" fill="#fff8e7"></g></g></g></svg>
<script>
const ns='http://www.w3.org/2000/svg';
function dot(parent,x,y,r){const e=document.createElementNS(ns,'circle');for(const[k,v]of Object.entries({cx:x,cy:y,r}))e.setAttribute(k,v);document.querySelector(parent).append(e);return e}
const final=window.alignmentEvidence.rows.at(-1);
const frontDots=final.left.map(p=>dot('#frontDots',p.x-140.7,p.y,3.1));
const sideDots=final.right.map(p=>dot('#sideDots',p.x-440,p.y,2.35));
gsap.set(frontDots,{opacity:0});gsap.set(sideDots,{opacity:0});
const tl=gsap.timeline({paused:true});
tl.to('#faceDetails',{opacity:0,duration:1.1,ease:'none'},0);
tl.to(frontDots,{opacity:1,duration:.12,stagger:.065,ease:'none'},1.55);
// These reveal timings are authoring hypotheses; native geometry is separately recorded.
const rows=window.alignmentEvidence.rows.filter(r=>r.divider_x!==null);
for(let i=0;i<rows.length;i++){
 const row=rows[i],t=row.source_second-106;
 const previous=i?rows[i-1].source_second-106:t;
 const duration=Math.max(.001,t-previous);
 tl.to('#sideField',{attr:{x:row.divider_x},duration,ease:'none'},previous);
 const left=row.left.length>10?row.left.reduce((s,p)=>s+p.x,0)/row.left.length:null;
 if(left!==null)tl.to('#front',{attr:{transform:`translate(${left} 0)`},duration,ease:'none'},previous);
}
tl.to('#side',{attr:{transform:'translate(440 0)'},duration:.8,ease:'power1.out'},7.36);
tl.to(sideDots,{opacity:1,duration:.12,stagger:.025,ease:'none'},7.65);
tl.to({}, {duration:.01},13.99);
window.__timelines={'posture-alignment-study':tl};
</script></body></html>
