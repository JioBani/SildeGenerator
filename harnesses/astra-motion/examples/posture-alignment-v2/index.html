<script>
const ns='http://www.w3.org/2000/svg';
function dot(parent,x,y,r){const e=document.createElementNS(ns,'circle');for(const[k,v]of Object.entries({cx:x,cy:y,r}))e.setAttribute(k,v);document.querySelector(parent).append(e);return e}
const final=window.alignmentEvidence.rows.at(-1);
const frontDots=final.left.map(p=>dot('#frontDots',p.x-140.7,p.y,3.1));
const sideDots=final.right.map(p=>dot('#sideDots',p.x-440,p.y,2.35));
gsap.set(frontDots,{opacity:0});gsap.set(sideDots,{opacity:0});
// A colored performance precedes abstraction; the silhouette is not the action.
const svg=document.querySelector('svg > g');
function shape(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
const performer=shape('g',{id:'profilePerformance',transform:'translate(760 0)'},svg);
const torso=shape('path',{d:'M-28 360L-42 247Q-49 164 8 162Q52 150 60 177Q29 203 2 254L30 336V360Z',fill:'#7862a5'},performer);
const neck=shape('path',{d:'M36 178L90 154',stroke:'#fa6093','stroke-width':20},performer);
const head=shape('g',{transform:'translate(106 155) rotate(72)'},performer);
shape('path',{d:'M-34-8Q-54-41-25-55Q13-71 30-46L29 0Z',fill:'#003c55'},head);
shape('path',{d:'M-21-31Q13-41 31-15V3L46 12Q48 20 31 20Q23 50-1 37Q-19 29-21 7Z',fill:'#fa6093'},head);
shape('circle',{cx:-22,cy:-2,r:12,fill:'#fa6093'},head);

shape('path',{d:'M7 27Q17 37 29 29',fill:'none',stroke:'#003c55','stroke-width':3},head);
shape('rect',{x:-38,y:-55,width:94,height:12,rx:5,fill:'#8975b1'},head);

shape('rect',{x:-27,y:-102,width:35,height:48,fill:'#8975b1'},head);
for(let i=0;i<3;i++)shape('path',{d:`M-20 ${-93+i*11}H23`,stroke:'#fff8e7','stroke-width':2},head);
const arm=shape('path',{d:'M5 211Q0 297 49 284L74 240',fill:'none',stroke:'#fa6093','stroke-width':15,'stroke-linecap':'round'},performer);
const grip=shape('g',{transform:'translate(74 240)'},performer);
shape('circle',{r:11,fill:'#fa6093'},grip);
shape('rect',{x:-22,y:-15,width:55,height:15,fill:'#003c55'},grip);
shape('rect',{x:-22,y:-15,width:55,height:7,fill:'#1cb5a4'},grip);
for(let i=0;i<2;i++)shape('path',{d:`M${-18+i*25}-8l10-7h7l-10 7Z`,fill:'#fff8e7'},grip);
shape('path',{d:'M-18 211V360',stroke:'#fa6093','stroke-width':14},performer);
performer.setAttribute('opacity',0);
const tl=gsap.timeline({paused:true});
tl.to('#faceDetails',{opacity:0,duration:1.1,ease:'none'},0);
tl.to(frontDots,{opacity:1,duration:.12,stagger:.065,ease:'none'},1.55);
// These reveal timings are authoring hypotheses; native geometry is separately recorded.
const rows=window.alignmentEvidence.rows.filter(r=>r.divider_x!==null);
for(let i=0;i<rows.length;i++){
 const row=rows[i],t=row.source_second-106;
 const previous=i?rows[i-1].source_second-106:t;
 const duration=Math.max(.001,t-previous);
 tl.to('#sideField',{attr:{x:row.divider_x},duration,ease:'none'},previous);
 const left=row.left.length>10?row.left.reduce((s,p)=>s+p.x,0)/row.left.length:null;
 if(left!==null)tl.to('#front',{attr:{transform:`translate(${left} 0)`},duration,ease:'none'},previous);
}
tl.set('#side',{opacity:0,attr:{transform:'translate(440 0)'}},0);
tl.set(performer,{opacity:1},7.1);
tl.to(performer,{attr:{transform:'translate(440 0)'},duration:.32,ease:'power1.out'},7.1);
tl.to(head,{attr:{transform:'translate(0 52) rotate(0)'},duration:.4,ease:'power1.inOut'},7.48);
tl.to(neck,{attr:{d:'M-7 133L0 79'},duration:.4,ease:'power1.inOut'},7.48);
tl.to(torso,{attr:{d:'M-28 360L-29 247Q-42 122-7 119Q40 115 35 155Q29 210 30 264L30 336V360Z'},duration:.4,ease:'power1.inOut'},7.48);
tl.to(arm,{attr:{d:'M5 211Q0 269 24 288L46 314'},duration:.4,ease:'power1.inOut'},7.48);
tl.to(grip,{attr:{transform:'translate(46 314) rotate(35)'},duration:.4,ease:'power1.inOut'},7.48);
tl.to(performer,{opacity:0,duration:.17,ease:'none'},7.88);
tl.to('#side',{opacity:1,duration:.17,ease:'none'},7.88);
tl.to(sideDots,{opacity:1,duration:.12,stagger:.018,ease:'none'},8.85);
tl.to({}, {duration:.01},13.99);
window.__timelines={'posture-alignment-study':tl};
</script></body></html>
