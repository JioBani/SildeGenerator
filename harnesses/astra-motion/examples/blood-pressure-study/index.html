</svg></div><script>
gsap.config({force3D:false});const ns='http://www.w3.org/2000/svg';function add(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
const tl=gsap.timeline({paused:true});
document.querySelector('#heart').setAttribute('transform','translate(480 580) scale(1)');
for(const [base,sign]of [[345,-1],[730,1]]){const shape=phase=>{let d='';for(let x=-500;x<=2400;x+=40){const y=base+sign*48*Math.pow(Math.max(0,Math.cos(x/210-phase)),6);d+=(x===-500?'M':'L')+x+' '+y.toFixed(3)}return d};for(const [stroke,width,dash]of [['#a22220',88,null],['#ff7c65',54,null],['#ffab88',36,'1 26'],['#ffe8c2',13,'10 15']]){
 const p=add('path',{d:shape(0),stroke,'stroke-width':width,fill:'none',...(dash?{'stroke-dasharray':dash,'stroke-linecap':width===36?'round':'butt'}:{})},document.querySelector('#walls'));
 const wave=gsap.timeline({repeat:14});for(let s=1;s<=8;s++)wave.to(p,{attr:{d:shape(s*Math.PI/4)},duration:.275,ease:'none'});tl.add(wave,0);
}}
for(let i=0;i<18;i++)for(const[a,b]of [[470,395],[610,680]])add('path',{d:`M${50+i*110} ${a}V${b}`,stroke:'#ffd95e','stroke-width':6,'marker-end':'url(#arrow)'},document.querySelector('#vectors'));
for(let i=0;i<88;i++){const x=(i%11)*90,y=Math.floor(i/11)*145;add('path',{d:`M${x} ${y}h45v60h-20v55h40`,stroke:i%3?'#a82020':'#d8322e','stroke-width':16,fill:'none','stroke-linejoin':'round'},document.querySelector('#circuits'))}
for(let i=0;i<140;i++){const x=(i%14)*65-440,y=Math.floor(i/14)*140-150;add('path',{d:`M${x} ${y}h25v45h-16v45h34`,stroke:i%3?'#a82020':'#147968','stroke-width':10,fill:'none','stroke-linejoin':'round'},document.querySelector('#bodyCircuits'))}
tl.to('#heart',{attr:{transform:'translate(480 580) scale(.94)'},duration:.3,repeat:17,yoyo:true,ease:'sine.inOut'},0)
.to('#heartVectors',{opacity:0,duration:.3},1.2)
.to('.heartBody',{fill:'#d78c75',duration:.35},3.5)
.to('#heartPanel',{attr:{transform:'translate(-970 0)'},duration:.8,ease:'power2.inOut'},5)
.to('#vesselCamera',{attr:{transform:'translate(0 0)'},duration:.8,ease:'power2.inOut'},5)
.to('#diastolicA',{opacity:1,duration:.2},3.5).set('#diastolicA',{opacity:0},7.5)
.set('#systolic',{opacity:1},7.5).set('#systolic',{opacity:0},9.5)
.set('#rangeHigh',{opacity:1},9.5).set('#rangeHigh',{opacity:0},13.5)
.set('#diastolicB',{opacity:1},13.5).set('#diastolicB',{opacity:0},15.5)
.set('#rangeLow',{opacity:1},15.5).set('#rangeLow',{opacity:0},19.5)
.to('#vectors',{opacity:1,duration:.3},17.5)
.set('#combined',{opacity:1},19.5)
.to('#field',{attr:{transform:'translate(-1920 0)'},duration:1,ease:'power2.inOut'},22)
.to('#bodyPanel',{attr:{transform:'translate(0 0)'},duration:1,ease:'power2.inOut'},22)
.to('#bodyTitle',{opacity:1,duration:.3},24)
.to({}, {duration:.1},29.9);
window.__timelines={'blood-pressure-study':tl};
</script></body></html>
