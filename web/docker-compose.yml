name: slidegen-web

services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
